<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 24 24" width="24" height="24" class="icon-root" stroke-width="1.5" fill-rule="evenodd">
  <title>Fancy &amp; Icon &#169;</title>
  <desc>An icon with {braces} and "quotes"</desc>
  <!-- an inner comment that must be stripped -->
  <defs>
    <linearGradient id="gradient">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.5"/>
