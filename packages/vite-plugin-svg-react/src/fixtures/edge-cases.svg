  </defs>
  <path d="M0 0h24v24H0z" style="fill: red; -webkit-transform: rotate(3deg); --brand: #f00" data-part="path" aria-hidden="true"/>
  <use xlink:href="#gradient" xml:lang="en"/>
  <text x="12" y="20">Braces {and} "quotes" \ backslash</text>
